name: Deploy Pages

# Regenerates the site whenever anything lands on main — in particular the
# feed XMLs the crawler pushes. build_feeds.py rescans *.xml, so new feeds
# appear on the site without code changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build feed manifest
        run: python3 scripts/build_feeds.py

      - name: Stage site
        run: |
          mkdir -p _site
          cp -R index.html manifest.json sw.js assets feeds.json *.xml _site/

      # sw.js serves the core assets stale-while-revalidate and its activate
      # handler only evicts caches under a *different* name, so the key has to
      # move whenever those assets do. Deriving it here rather than in the local
      # Justfile means it is right however the commit was pushed. sw.js itself is
      # part of the input, with its own CACHE_NAME line stripped, so a change to
      # the caching logic busts the cache too.
      - name: Stamp service worker cache key
        run: |
          key="airss-cache-$(cat _site/index.html _site/assets/app.js _site/assets/style.css \
            <(sed '/^const CACHE_NAME/d' _site/sw.js) | sha256sum | cut -c1-8)"
          sed -i "s|^const CACHE_NAME = '.*';|const CACHE_NAME = '$key';|" _site/sw.js
          echo "airss: service worker cache key $key"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
